<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Paiement — Alpes Désembouage</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
      font-family: 'Inter', system-ui, sans-serif; color: #1a1f27; background: linear-gradient(160deg, #0d3d73, #145a9e); }
    .card { background: #fff; border-radius: 18px; padding: 36px 28px; max-width: 420px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
    img { width: 64px; height: 64px; }
    h1 { font-family: 'Poppins', sans-serif; color: #0d3d73; font-size: 24px; margin: 16px 0 8px; }
    p { color: #5a6472; line-height: 1.5; margin: 0 0 12px; }
    a { color: #145a9e; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <img src="images/favicon.svg" alt="">
    <h1 id="title">Merci pour votre paiement !</h1>
    <p id="text">Votre règlement a bien été reçu. Un reçu vous est envoyé par e-mail si vous avez renseigné votre adresse.</p>
    <p>Merci pour votre confiance.<br><b>Alpes Désembouage</b></p>
    <p><a href="https://maps.app.goo.gl/sVYWGCqHb2V59HXk9">Laisser un avis Google</a> · <a href="/">Retour au site</a></p>
  </div>
  <script>
    if (new URLSearchParams(location.search).has('annule')) {
      document.getElementById('title').textContent = 'Paiement non effectué';
      document.getElementById('text').textContent = "Le paiement a été interrompu, rien n'a été débité. Vous pouvez réessayer avec le même lien, ou nous contacter au 06 58 65 80 56.";
    }
  </script>
</body>
</html>
